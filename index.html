<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To do task</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css">
</head>

<body>

        <div id="bg">
            <body background ="77540fe343f2bf2836982ca8ce63e6c1.jpg" class="stretch">
        </div>


   <div class="container">
        <div class="todoapp">
            <h1>To Do Tasks</h1>
            <div class="stat-container">
                <div class="details">
                    <h2>Track Your Daily Do's</h2>

                    <div id="borderr">
                        <div id="progressbar">
                            <div id="progress"></div>
                        </div>
                    </div>
                </div>
            
                <div class="stats-number">
                <p id="numbers">  0 / 0</p>
                </div>
            </div>
            <form class="inputs">
                 <input type ="text" id="task" placeholder="add a new task here">
                 <button type="submit" id="add-task"><i class="fa-solid fa-plus"></i></button>   
            </form>
             <div class ="todoContainer">
                 <ul id="task-list">            
                 </ul>
                 <img class="empty-img" src="https://images.unsplash.com/vector-1752217168282-743ba32a275a?w=500&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8Nnx8bm90ZWJvb2t8ZW58MHx8MHx8fDI%3D">
             </div>
        </div>
   </div> 
  


<script src="script.js" ></script>
    <script
        src="https://cdn.jsdelivr.net/npm/@tsparticles/confetti@3.0.3/tsparticles.confetti.bundle.min.js">
    </script>
</body>
</html>
